# fly.toml app configuration file generated for evida-suntoyo-website on 2026-09-24T03:14:49+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'evida-suntoyo-website'
primary_region = 'iad'
console_command = '/rails/bin/rails console'

[build]

[env]
  SOLID_QUEUE_IN_PUMA = "true"
  HTTP_PORT = "8080"

[[mounts]]
  source = 'rails_storage'
  destination = '/rails/storage'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
